services:
  - type: web
    name: greenpulse-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --only-binary=:all: -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173
